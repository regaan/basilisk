name: Build and Release Basilisk Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      community_release:
        description: Build unsigned Community installers and publish a release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag used only for a Community release
        required: true
        type: string
        default: v2.0.2

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.21'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Validate Community release tag
        if: github.event_name == 'workflow_dispatch' && inputs.community_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Community release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$PROJECT_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match project version v$PROJECT_VERSION" >&2
            exit 1
          }
      - name: Verify dependency locks
        run: python scripts/verify_dependency_locks.py
      - name: Install and test Python
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pytest -q
          python -m ruff check . --select E9,F63,F7,F82
      - name: Test Go
        working-directory: native/go
        run: |
          go test ./...
          go vet ./...
      - name: Test C encoder
        run: |
          gcc -O2 -Wall -Wextra -Werror native/c/encoder.c native/c/test_encoder.c \
            -I native/c -o /tmp/basilisk-encoder-test
          /tmp/basilisk-encoder-test
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/c/encoder.c native/c/fuzz_encoder.c -I native/c \
            -o /tmp/basilisk-encoder-fuzz
          /tmp/basilisk-encoder-fuzz
      - name: Test desktop
        working-directory: desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm ci
          xvfb-run --auto-servernum npm run test:e2e
          xvfb-run --auto-servernum npm run benchmark
          npm audit --audit-level=high

  build:
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
      APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
      COSIGN_KEY_REF: ${{ secrets.COSIGN_KEY_REF }}
      BASILISK_NATIVE_SIGNING_KEY: ${{ secrets.BASILISK_NATIVE_SIGNING_KEY }}
      BASILISK_ALLOW_EPHEMERAL_NATIVE_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.community_release }}
      BASILISK_REQUIRE_VENDOR_TRUST: ${{ startsWith(github.ref, 'refs/tags/v') }}
      BASILISK_SKIP_NOTARIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.community_release && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.community_release && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Keep Linux release binaries compatible with the oldest Ubuntu LTS in
        # standard support. ubuntu-latest currently builds the PyInstaller
        # sidecar against glibc 2.38, which prevents the AppImage from starting
        # on older supported distributions.
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.21'
          cache: false

      - name: Install Python Dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
        shell: bash

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools imagemagick build-essential gcc xvfb

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build Native Extensions
        run: |
          if [ "$BASILISK_REQUIRE_VENDOR_TRUST" = "true" ] && [ -z "$BASILISK_NATIVE_SIGNING_KEY" ]; then
            echo "Tagged releases require BASILISK_NATIVE_SIGNING_KEY" >&2
            exit 1
          fi
          chmod +x native/build.sh
          ./native/build.sh all
        shell: bash

      - name: Verify and embed native integrity trust
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.community_release)
        run: |
          python scripts/verify_native_manifests.py native/build basilisk/native_libs
          python scripts/embed_native_public_key.py
        shell: bash

      - name: Compile Python Sidecar
        run: |
          pyinstaller basilisk-backend.spec

      - name: Prepare Desktop Folder (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p desktop/bin
          cp dist/basilisk-backend desktop/bin/
        shell: bash

      - name: Prepare Desktop Folder (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p desktop/bin
          cp dist/basilisk-backend.exe desktop/bin/basilisk-backend.exe
        shell: bash

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Prepare Linux icon
        if: runner.os == 'Linux'
        working-directory: ./desktop
        shell: bash
        run: |
          mkdir -p build
          if command -v magick >/dev/null 2>&1; then
            magick src/assets/logo.jpg -resize 512x512 build/icon.png
          else
            convert src/assets/logo.jpg -resize 512x512 build/icon.png
          fi

      - name: Prepare macOS icons
        if: runner.os == 'macOS'
        working-directory: ./desktop
        shell: bash
        run: |
          mkdir -p build/icon.iconset
          sips -s format png -Z 512 src/assets/logo.jpg --out build/icon.png
          for size in 16 32 64 128 256 512; do
            sips -s format png -z "$size" "$size" src/assets/logo.jpg --out "build/icon.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -s format png -z "$double" "$double" src/assets/logo.jpg --out "build/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Prepare Windows icons
        if: runner.os == 'Windows'
        working-directory: ./desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path 'src/assets/logo.jpg'))
          try {
            foreach ($size in @(512, 256)) {
              $bitmap = New-Object System.Drawing.Bitmap $size, $size
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try {
                  $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                  $graphics.DrawImage($source, 0, 0, $size, $size)
                } finally { $graphics.Dispose() }
                $bitmap.Save((Join-Path (Resolve-Path build) "icon-$size.png"), [System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $bitmap.Dispose() }
            }
          } finally { $source.Dispose() }
          Move-Item -LiteralPath build/icon-512.png -Destination build/icon.png -Force
          $png = [System.IO.File]::ReadAllBytes((Resolve-Path build/icon-256.png))
          $stream = [System.IO.File]::Open((Join-Path (Resolve-Path build) 'icon.ico'), [System.IO.FileMode]::Create)
          $writer = New-Object System.IO.BinaryWriter $stream
          try {
            $writer.Write([uint16]0); $writer.Write([uint16]1); $writer.Write([uint16]1)
            $writer.Write([byte]0); $writer.Write([byte]0); $writer.Write([byte]0); $writer.Write([byte]0)
            $writer.Write([uint16]1); $writer.Write([uint16]32)
            $writer.Write([uint32]$png.Length); $writer.Write([uint32]22); $writer.Write($png)
          } finally { $writer.Dispose(); $stream.Dispose() }
          Remove-Item -LiteralPath build/icon-256.png -Force

      - name: Copy License
        working-directory: ./desktop
        run: |
          cp ../LICENSE LICENSE.txt || echo "MIT License" > LICENSE.txt
        shell: bash

      - name: Prepare Build Trust Metadata
        run: |
          BASILISK_HAS_APPLE_SIGNING=false
          BASILISK_HAS_APPLE_NOTARIZATION=false
          BASILISK_HAS_WINDOWS_SIGNING=false

          if [ "${{ runner.os }}" = "macOS" ] && [ -n "$APPLE_SIGNING_CERT_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            BASILISK_HAS_APPLE_SIGNING=true
          fi

          if [ "${{ runner.os }}" = "macOS" ] && [ -n "$APPLE_TEAM_ID" ]; then
            if { [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; } || { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; }; then
              BASILISK_HAS_APPLE_NOTARIZATION=true
            fi
          fi

          if [ "${{ runner.os }}" = "Windows" ] && [ -n "$WINDOWS_SIGNING_CERT_BASE64" ]; then
            BASILISK_HAS_WINDOWS_SIGNING=true
          fi

          export BASILISK_HAS_APPLE_SIGNING
          export BASILISK_HAS_APPLE_NOTARIZATION
          export BASILISK_HAS_WINDOWS_SIGNING

          python scripts/write_build_metadata.py \
            --platform "${{ runner.os }}" \
            --output desktop/build/release-channel.json \
            --github-env "$GITHUB_ENV"
        shell: bash

      - name: Require platform signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -n "$WINDOWS_SIGNING_CERT_BASE64" || { echo "Tagged Windows releases require WINDOWS_SIGNING_CERT_BASE64" >&2; exit 1; }
            test -n "$WINDOWS_SIGNING_CERT_PASSWORD" || { echo "Tagged Windows releases require WINDOWS_SIGNING_CERT_PASSWORD" >&2; exit 1; }
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            test -n "$APPLE_SIGNING_CERT_BASE64" || { echo "Tagged macOS releases require APPLE_SIGNING_CERT_BASE64" >&2; exit 1; }
            test -n "$APPLE_SIGNING_CERT_PASSWORD" || { echo "Tagged macOS releases require APPLE_SIGNING_CERT_PASSWORD" >&2; exit 1; }
            test -n "$APPLE_TEAM_ID" || { echo "Tagged macOS releases require APPLE_TEAM_ID" >&2; exit 1; }
            if ! { [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; } && \
               ! { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; }; then
              echo "Tagged macOS releases require App Store Connect API credentials or Apple ID notarization credentials" >&2
              exit 1
            fi
          fi

      - name: Build upgrade baseline package
        working-directory: ./desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          BASILISK_SKIP_NOTARIZE: "1"
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npx electron-builder --win=nsis --publish never \
              --config.extraMetadata.version=1.9.99 \
              --config.directories.output=dist-baseline
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npx electron-builder --linux=deb --publish never \
              --config.extraMetadata.version=1.9.99 \
              --config.directories.output=dist-baseline
          else
            npx electron-builder --mac=dmg --publish never \
              --config.extraMetadata.version=1.9.99 \
              --config.directories.output=dist-baseline
          fi
        shell: bash

      - name: Setup Apple Code Signing Identity
        if: runner.os == 'macOS' && env.BASILISK_REQUIRE_VENDOR_TRUST == 'true' && env.APPLE_SIGNING_CERT_BASE64 != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/basilisk-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_SIGNING_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        shell: bash

      - name: Setup Apple Notarization Credentials
        if: runner.os == 'macOS' && env.BASILISK_REQUIRE_VENDOR_TRUST == 'true' && env.APPLE_TEAM_ID != ''
        run: |
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Setup Windows Code Signing Certificate
        if: runner.os == 'Windows' && env.BASILISK_REQUIRE_VENDOR_TRUST == 'true' && env.WINDOWS_SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "basilisk-windows-signing.p12"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $link = "file:///" + ($certPath -replace "\\","/")
          "CSC_LINK=$link" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:WINDOWS_SIGNING_CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Electron App
        working-directory: ./desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      - name: Exercise packaged backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            desktop/bin/basilisk-backend.exe --help
          else
            desktop/bin/basilisk-backend --help
          fi

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path desktop/dist -Filter *.exe -File
          if (-not $artifacts) { throw "No Windows installer was produced" }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($artifact.FullName): $($signature.Status)"
            }
          }

      - name: Verify Windows install, launch, upgrade, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = Get-ChildItem -Path desktop/dist-baseline -Filter '*.exe' -File | Select-Object -First 1
          $current = Get-ChildItem -Path desktop/dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $baseline -or -not $current) { throw "Windows lifecycle installers are missing" }
          & desktop/tests/windows-installer-lifecycle.ps1 -BaselineInstaller $baseline.FullName -CurrentInstaller $current.FullName

      - name: Verify Linux package structure
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -n "$(find desktop/dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb=$(find desktop/dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null

      - name: Verify Linux install, launch, upgrade, and uninstall
        if: runner.os == 'Linux'
        shell: bash
        run: |
          baseline_deb=$(find desktop/dist-baseline -maxdepth 1 -name '*.deb' -print -quit)
          current_deb=$(find desktop/dist -maxdepth 1 -name '*.deb' -print -quit)
          current_appimage=$(find desktop/dist -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$baseline_deb" && test -n "$current_deb" && test -n "$current_appimage"
          chmod +x desktop/tests/linux-package-lifecycle.sh
          desktop/tests/linux-package-lifecycle.sh "$baseline_deb" "$current_deb" "$current_appimage"

      - name: Verify macOS package structure
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path=$(find desktop/dist -type d -name '*.app' -print -quit)
          dmg_path=$(find desktop/dist -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$app_path"
          test -n "$dmg_path"
          if [ "$BASILISK_REQUIRE_VENDOR_TRUST" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app_path"
          fi
          hdiutil verify "$dmg_path"

      - name: Verify macOS install, launch, upgrade, and uninstall
        if: runner.os == 'macOS'
        shell: bash
        run: |
          baseline_dmg=$(find desktop/dist-baseline -maxdepth 1 -name '*.dmg' -print -quit)
          current_dmg=$(find desktop/dist -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$baseline_dmg" && test -n "$current_dmg"
          chmod +x desktop/tests/macos-package-lifecycle.sh
          desktop/tests/macos-package-lifecycle.sh "$baseline_dmg" "$current_dmg"

      - name: Copy Build Metadata for Release Artifacts
        run: |
          cp desktop/build/release-channel.json "desktop/dist/basilisk-build-metadata-${RUNNER_OS}.json"
        shell: bash

      - name: Staple and validate macOS artifacts
        if: runner.os == 'macOS' && env.BASILISK_REQUIRE_VENDOR_TRUST == 'true' && env.APPLE_SIGNING_CERT_BASE64 != ''
        working-directory: ./desktop
        run: |
          find dist -maxdepth 3 \( -name '*.app' -o -name '*.dmg' -o -name '*.zip' \) -print0 | while IFS= read -r -d '' file; do
            xcrun stapler staple "$file"
            xcrun stapler validate "$file"
          done
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Basilisk-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.pacman
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.zip
            desktop/dist/*.tar.gz
            desktop/dist/basilisk-build-metadata-*.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.community_release)
    permissions:
      actions: write
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build Python distributions
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m build --no-isolation
          mkdir -p artifacts/Python
          cp dist/*.whl dist/*.tar.gz artifacts/Python/

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: List Downloaded Files
        run: find artifacts/ -type f | head -50

      - name: Generate Release Metadata
        run: |
          python scripts/generate_release_manifest.py --artifact-root artifacts --build-metadata-root artifacts

      - name: Render Release Notes
        run: |
          python scripts/render_release_notes.py \
            --tag "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}" \
            --artifacts-root artifacts \
            --output build/release-notes.md

      - name: Attest release build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.pacman
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.whl

      - name: Attest release SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.pacman
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.whl
          sbom-path: build/sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      - name: Create keyless Sigstore provenance proofs
        env:
          COSIGN_YES: "true"
          COSIGN_EXPERIMENTAL: "1"
        run: |
          mapfile -t FILES < <(find artifacts build -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.pacman' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.whl' -o -name '*.json' \) | sort)
          for file in "${FILES[@]}"; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file"
          done

      - name: Verify keyless Sigstore provenance proofs
        run: |
          EXPECTED_IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}"
          mapfile -t SIGNATURES < <(find artifacts build -type f -name '*.sig' | sort)
          test "${#SIGNATURES[@]}" -gt 0
          for signature in "${SIGNATURES[@]}"; do
            file="${signature%.sig}"
            certificate="${file}.pem"
            test -f "$file" && test -f "$certificate"
            cosign verify-blob \
              --certificate "$certificate" \
              --signature "$signature" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$file"
          done

      - name: Upload Security Metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Basilisk-release-security
          path: |
            build/release-manifest.json
            build/sbom.json
            build/provenance.json
            build/**/*.sig
            build/**/*.pem
            artifacts/**/*.sig
            artifacts/**/*.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Basilisk ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body_path: build/release-notes.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.pacman
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.whl
            artifacts/**/basilisk-build-metadata-*.json
            build/release-manifest.json
            build/sbom.json
            build/provenance.json
            build/**/*.sig
            build/**/*.pem
            artifacts/**/*.sig
            artifacts/**/*.pem

      - name: Trigger PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          SIGNING_REF: ${{ github.ref }}
        run: |
          gh workflow run python-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field release_tag="$RELEASE_TAG" \
            --field signing_ref="$SIGNING_REF"
